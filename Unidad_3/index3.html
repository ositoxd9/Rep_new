<!DOCTYPE html>
<html lang="es">
        <link rel="stylesheet" href="Style3.css">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Agenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-5">
    <h3>Ejercicio 3 - Agenda de Eventos</h3>
    
    <div class="mb-2">
        <label>Día:</label>
        <select id="diaAgenda" class="form-control">
            <option value="0">Lunes</option>
            <option value="1">Martes</option>
            <option value="2">Miércoles</option>
            <option value="3">Jueves</option>
            <option value="4">Viernes</option>
            <option value="5">Sábado</option>
            <option value="6">Domingo</option>
        </select>
    </div>

    <div class="mb-2"><label>Hora:</label><input type="text" id="horaAgenda" class="form-control"></div>
    <div class="mb-2"><label>Evento:</label><input type="text" id="eventoAgenda" class="form-control"></div>
    <div class="mb-2"><label>Descripción:</label><input type="text" id="descAgenda" class="form-control"></div>
    
    <button class="btn btn-success mb-3" onclick="guardarEvento()">Guardar Evento</button>

    <table class="table table-bordered">
        <thead>
            <tr><th>Día</th><th>Hora</th><th>Evento</th><th>Descripción</th></tr>
        </thead>
        <tbody>
            <tr><td>Lunes</td><td id="h-0"></td><td id="e-0"></td><td id="d-0"></td></tr>
            <tr><td>Martes</td><td id="h-1"></td><td id="e-1"></td><td id="d-1"></td></tr>
            <tr><td>Miércoles</td><td id="h-2"></td><td id="e-2"></td><td id="d-2"></td></tr>
            <tr><td>Jueves</td><td id="h-3"></td><td id="e-3"></td><td id="d-3"></td></tr>
            <tr><td>Viernes</td><td id="h-4"></td><td id="e-4"></td><td id="d-4"></td></tr>
            <tr><td>Sábado</td><td id="h-5"></td><td id="e-5"></td><td id="d-5"></td></tr>
            <tr><td>Domingo</td><td id="h-6"></td><td id="e-6"></td><td id="d-6"></td></tr>
        </tbody>
    </table>

    <br>
    <a href="index.html" class="btn btn-secondary">← Volver al submenú</a>
    <script src="funcion.js"></script>
</body>
</html>
