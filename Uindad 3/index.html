 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Arreglos con JS</title>
</head>
<body>

 <article class="col-sm-4">
    <h3> Temperatura semanal </h3>        
    <button class="btn btn-warning" onclick="capturaPromedioFunc()">Capturar la temperatura de los 7 dias</button>
    <button class="btn btn-success" onclick="mostrarTemperatura()">Mostrar Promedio</button>
    <hr>
    <p id="impPromedioTemperatura"></p>
    <p id="impMaximo"></p>
    <p id="impMinimo"></p>
 </article>

    <h2>Ejercicio 2</h2>
    <label>Puesto:</label>
    <select id="puesto">
    <option value="0">Diseñador</option>
    <option value="1">Programador</option>
    <option value="2">Líder</option>
    </select><br><br>
    <label>Nivel:</label>
    <select id="nivel">
    <option value="0">Newbe</option>
    <option value="1">Jr</option>
    <option value="2">Sr</option>
    </select>
    
   <article class="col-sm-4 p-3">
    <h3>Ejercicio 3 - Número 8</h3>
    <button class="btn btn-info" onclick="mostrarEjercicio3()">Generar Número 8</button>
    
    <p id="resultado" style="font-family: monospace; font-size: 24px; line-height: 2; white-space: pre;"></p>
 </article>

 <article class="col-sm-4 p-3">
    <h3>Ejercicio 5 - Agenda</h3>
    
    <label>Día:</label>
    <select id="diaAgenda" class="form-control">
        <option value="0">Lunes</option>
        <option value="1">Martes</option>
        <option value="2">Miércoles</option>
        <option value="3">Jueves</option>
        <option value="4">Viernes</option>
        <option value="5">Sábado</option>
        <option value="6">Domingo</option>
    </select><br>

    <label>Hora:</label>
    <input type="text" id="horaAgenda" class="form-control"><br>

    <label>Evento:</label>
    <input type="text" id="eventoAgenda" class="form-control"><br>

    <label>Descripción:</label>
    <input type="text" id="descAgenda" class="form-control"><br>

    <button class="btn btn-success mb-3" onclick="guardarEvento()">Guardar Evento</button>

    <!-- Tabla de la agenda -->
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Día</th>
                <th>Hora</th>
                <th>Evento</th>
                <th>Descripción</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Lunes</td>
                <td id="h-0"></td>
                <td id="e-0"></td>
                <td id="d-0"></td>
            </tr>
            <tr>
                <td>Martes</td>
                <td id="h-1"></td>
                <td id="e-1"></td>
                <td id="d-1"></td>
            </tr>
            <tr>
                <td>Miércoles</td>
                <td id="h-2"></td>
                <td id="e-2"></td>
                <td id="d-2"></td>
            </tr>
            <tr>
                <td>Jueves</td>
                <td id="h-3"></td>
                <td id="e-3"></td>
                <td id="d-3"></td>
            </tr>
            <tr>
                <td>Viernes</td>
                <td id="h-4"></td>
                <td id="e-4"></td>
                <td id="d-4"></td>
            </tr>
            <tr>
                <td>Sábado</td>
                <td id="h-5"></td>
                <td id="e-5"></td>
                <td id="d-5"></td>
            </tr>
            <tr>
                <td>Domingo</td>
                <td id="h-6"></td>
                <td id="e-6"></td>
                <td id="d-6"></td>
            </tr>
        </tbody>
    </table>
 </article>
    <script src="funcion.js"></script>
</section>
</body>
</html>
